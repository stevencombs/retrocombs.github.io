<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ site.favicon | default: "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.favicon_png | default: "/favicon-32.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.apple_touch_icon | default: "/apple-touch-icon.png" | relative_url }}">
    {% for item in site.data.social %}{% if item.rel == "me" %}
    <link rel="me" href="{{ item.url }}">
    {% endif %}{% endfor %}

{% unless page.ads == false %}
<!-- Adsense Code -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4132959196132899"
     crossorigin="anonymous"></script>
<!-- End Adsense Code -->
{% endunless %}

<!-- Google GA4 Tag (gtag.js) added: 2022-11-07 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GMC3C0FD4Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GMC3C0FD4Z');
  </script>
<!-- End Google GA4 Tag-->

  </head>
  <body class="{% if page.layout == "home" %}home{% endif %}{% if page.url == "/supporters" or page.url == "/supporters/" or page.url == "/supporters.html" %} supporters{% endif %}">
    <a class="skip" href="#main">Skip to content</a>
    {% include header.html %}
    <div class="stripes">{% include stripes.html %}</div>
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ "/assets/js/theme.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/post-cards.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/yt-lite.js" | relative_url }}" defer></script>
    {% include search-scripts.html %}
  </body>
</html>
