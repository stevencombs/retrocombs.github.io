---
layout: default
---
<section class="page-hero{% if page.explore_page %} page-hero-explore{% endif %}">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{{ "/" | relative_url }}">Home</a><span aria-hidden="true">›</span>{{ page.title }}</nav>
    <h1>{{ page.title }}</h1>
  </div>
</section>
<div class="wrap page-main">
  <div class="page-body">
    <div class="prose{% if page.wide %} prose-wide{% endif %}">
      {{ content }}
    </div>
  </div>
  {% if page.ads == "light" %}
  {% include ad.html slot="end" %}
  {% endif %}
</div>
