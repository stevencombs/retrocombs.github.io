        border-radius: 14px; background: #e8dcc8; }

#banner { left: 1083px; top: 726px; width: 645px; height: 50px; transform-origin: 50% 50%; }

<script>
(function () {

    var r = document.createElementNS(NS, 'rect'); r.setAttribute('x', x); r.setAttribute('y', y);

var HEART = ['.###...###.', '#####.#####', '###########', '###########', '###########',
             '.#########.', '..#######..', '...#####...', '....###....', '.....#.....'];
var COIN = ['...oooo...', '.ooyyyyoo.', '.oyyddyyo.', 'oyyddddyyo', 'oyydyyyyyo', 'oyyddddyyo',
            'oyyyyydyyo', 'oyyddddyyo', '.oyyddyyo.', '.ooyyyyoo.', '...oooo...'];

// ======================= fill text (textContent only) =======================
var cardEl = $('card'), headEl = $('headline'), banEl = $('banner'), pillEl = $('pill'), nameEl = $('name');
var avatarEl = $('avatar'), labelEl = $('label'), readyEl = $('ready'), fieldEl = $('field');
nameEl.textContent = NAME;
var initial = (Array.from(NAME).filter(function (ch) { return /[0-9A-Za-z\u00c0-\u024f]/.test(ch); })[0] || '');
if (HAS_NAME && initial) {
  $('avatarLetter').textContent = initial.toUpperCase();
  var cols = ['#f5a623', '#7cba3d', '#4aa3d4', '#0000f0', '#c62828'], hsum = 0;
  Array.from(NAME).forEach(function (ch) { hsum = (hsum * 31 + ch.codePointAt(0)) >>> 0; });
  avatarEl.style.background = cols[hsum % cols.length];
} else {
  $('avatarLetter').remove();
  avatarEl.style.background = '#c62828';
  var hs = pixSvg(HEART, 3, { '#': '#ffffff' }); hs.style.marginTop = '3px'; avatarEl.appendChild(hs);
}
var coinEl = null;
if (AMOUNT) { $('pillText').textContent = AMOUNT; }
else { $('pillText').remove(); pillEl.style.padding = '0 15px';
       coinEl = pixSvg(COIN, 3, { o: '#2a2a2a', y: '#f5e642', d: '#f5a623' }); pillEl.appendChild(coinEl); }

// message -> up to 2 lines of 40 cells (word wrap; hard wrap if words don't fit)
var COLS = 40;
function wrap(s) {
  var words = s.split(' '), lines = [''], ok = true;
  words.forEach(function (w) { var cur = lines[lines.length - 1];
    if (!cur.length) lines[lines.length - 1] = w;
    else if (Array.from(cur).length + 1 + Array.from(w).length <= COLS) lines[lines.length - 1] = cur + ' ' + w;
    else lines.push(w); });
  lines.forEach(function (l) { if (Array.from(l).length > COLS) ok = false; });
  if (ok && lines.length <= 2) return lines;
  var a = Array.from(s); return [a.slice(0, COLS).join(''), a.slice(COLS, 2 * COLS).join('').trim()].filter(function (l) { return l.length; });
}
var LINES = wrap(MSG).map(function (l) { return Array.from(l); });
var NCH = LINES.reduce(function (n, l) { return n + l.length; }, 0);
var lineSpans = [$('line0').firstChild, $('line1').firstChild];
var cursorEl = document.createElement('span'); cursorEl.id = 'cursor';
// key times (C64 typing, deterministic jitter, always finished by T_TYPE_MAX)
var KEYS = (function () {
  var dt = clamp(3.2 / NCH, 0.055, 0.14), out = [], t = T_TYPE, flat = [].concat.apply([], LINES);
  for (var i = 0; i < NCH; i++) { out.push(t); t += dt * (0.8 + 0.4 * hash(i)) + (flat[i] === ' ' ? 0.03 : 0); }
  var last = out[out.length - 1]; if (last > T_TYPE_MAX) out = out.map(function (k) { return T_TYPE + (k - T_TYPE) * (T_TYPE_MAX - T_TYPE) / (last - T_TYPE); });
  return out.map(function (k) { return Math.round(k * 1000) / 1000; });
})();

// ======================= fit checks =======================
function fit() {
  var maxW = 877 - 14 - pillEl.offsetWidth - 18 - 85, fs = 18;
  nameEl.style.width = 'auto'; nameEl.style.fontSize = fs + 'px';
  while (nameEl.scrollWidth > maxW && fs > 10) { fs--; nameEl.style.fontSize = fs + 'px'; nameEl.style.top = (35 + (18 - fs) / 2) + 'px'; }
  nameEl.style.width = maxW + 'px';
}

// ======================= canvases =======================
var fx = $('fx'), cx = fx.getContext('2d'), fc = $('fieldCanvas'), fcx = fc.getContext('2d');
var LOGO = new Image(); LOGO.src = 'assets/logo-card.png';
var LW = 300, LH = 228, LM = 112, LX = 1920 - 60 - LW, LY = 60;   // upper-right corner badge
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
var wc = mk(LW + 2 * LM, LH), wcx = wc.getContext('2d'), tr = mk(LW + 2 * LM, LH), tb = mk(LW + 2 * LM, LH);
var r0 = rngf(1985), SPARKS = [];
for (var i = 0; i < 48; i++) SPARKS.push({ a: r0() * Math.PI * 2, v: 165 + r0() * 255, s: [5, 7, 9, 11][Math.floor(r0() * 4)],
  c: ['#f5a623', '#f5e642', '#7cba3d', '#4aa3d4', '#0000f0', '#c62828', '#ffffff'][Math.floor(r0() * 7)], plus: r0() < .45, tw: r0() * 6 });
var BX = 1405, BY = 748;   // burst centre

function drawField(t, fi) {
  var W = 849, H = 110, O = 2, B = 11, load = (t >= T_LOAD0 && t < T_LOAD1), burst = (t >= T_B && t < T_B + D_BURST);
  fcx.clearRect(0, 0, W, H);
  fcx.fillStyle = '#2a2a2a'; fcx.fillRect(0, 0, W, H);
  if (load || burst) {
    var r = rngf(fi * 7 + 1), y = O;
    while (y < H - O) { var h = 2 + Math.floor(r() * 8); fcx.fillStyle = C64PAL[1 + Math.floor(r() * 15)];
      fcx.fillRect(O, y, W - 2 * O, Math.min(h, H - O - y)); y += h; }
  } else { fcx.fillStyle = '#7869c4'; fcx.fillRect(O, O, W - 2 * O, H - 2 * O); }
  fcx.fillStyle = '#40318d'; fcx.fillRect(B, B, W - 2 * B, H - 2 * B);
  if (burst) {
    var u = (t - T_B) / D_BURST, ih = H - 2 * B;
    ['#67b6bd', '#bfce72', '#b86962'].forEach(function (col, k) {
      var cyb = B + ((u * 1.8 + k * 0.33) % 1) * ih;
      for (var j = -5; j <= 5; j++) { var yy = cyb + j * 1.5; if (yy < B || yy > B + ih - 1.5) continue;
        fcx.globalAlpha = 1 - Math.abs(j) / 6; fcx.fillStyle = col; fcx.fillRect(B, yy, W - 2 * B, 1.5); }
    });
    fcx.globalAlpha = 1;
  }
}
function drawSparks(t) {
  var u = t - T_B; if (u < 0 || u > 1.3) return;
  SPARKS.forEach(function (p) {
    var r = p.v * eout(clamp(u / 1.1)) * 0.9, x = BX + Math.cos(p.a) * r * 1.15, y = BY + Math.sin(p.a) * r * 0.62 + 188 * u * u;
    var a = clamp(1.4 - u / 0.95); if (a <= 0 || Math.floor((u + p.tw) * 14) % 3 === 0) return;
    var s = p.s; cx.globalAlpha = a; cx.fillStyle = p.c;
    if (p.plus) { cx.fillRect(x - s * 1.5, y - s / 2, s * 3, s); cx.fillRect(x - s / 2, y - s * 1.5, s, s * 3); }
    else { cx.fillStyle = '#2a2a2a'; cx.fillRect(x - s, y - s, 2 * s, 2 * s); cx.fillStyle = p.c; cx.fillRect(x - s + 1.5, y - s + 1.5, 2 * s - 3, 2 * s - 3); }
  });

}

function gauss(r) { var u = Math.max(1e-6, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function tint(dst, col) { var d = dst.getContext('2d'); d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, dst.width, dst.height);
  d.drawImage(wc, 0, 0); d.globalCompositeOperation = 'source-in'; d.fillStyle = col; d.fillRect(0, 0, dst.width, dst.height);
  d.globalCompositeOperation = 'source-over'; }
function backin(u, k) { return u * u * ((k + 1) * u - k); }
function drawLogo(t, fi) {
  if (t < T_LOGO_IN || t >= T_LOGO_OUT + D_LOGO_OUT || !LOGO.complete || !LOGO.naturalWidth) return;
  var g = 0, alpha = 1, u, ly = LY;
  if (t < T_LOGO_IN + D_DROP) { u = (t - T_LOGO_IN) / D_DROP; ly = -LH - 20 + (LY + LH + 20) * eback(u, 1.4); }
  if (t >= T_LAND && t < T_LAND + D_GLITCH) { u = (t - T_LAND) / D_GLITCH; g = clamp(0.7 * (1 - eout(u)) + (fi % 4 === 0 ? .2 : 0)); }
  if (t >= T_LOGO_OUT) { u = (t - T_LOGO_OUT) / D_LOGO_OUT; ly = LY - (LY + LH + 40) * backin(u, 1.4);

// ======================= frame =======================
var lastCount = -1, live = false;
function show(el, on) { el.style.visibility = on ? 'visible' : 'hidden'; }
function render(t) {

    var av = t < T_AV ? 0 : eback(prog(t, T_AV, 0.35), 1.8); avatarEl.style.transform = 'scale(' + av.toFixed(3) + ')';
    var nr = (1 - eout(prog(t, T_NAME, 0.35))) * 100;

    var n = 0; for (var k = 0; k < KEYS.length; k++) if (KEYS[k] <= t) n++;
    var rem = n, active = 0;

      lineSpans[L].textContent = line.slice(0, take).join(''); if (take > 0) active = L;
      lineSpans[L].parentNode.style.color = burst ? '#ffffff' : '#7869c4'; }
    if (n > 0 && n < NCH && LINES[active] && lineSpans[active].textContent.length === LINES[active].join('').length && active < LINES.length - 1) active++;

    var curOn = t >= T_READY && !burst && (t - lastKey < 0.35 || Math.floor((t - T_READY) / 0.27) % 2 === 0);
    if (cursorEl.parentNode !== lineSpans[active].parentNode) lineSpans[active].parentNode.appendChild(cursorEl);
    cursorEl.style.opacity = curOn ? '1' : '0';
    if (live && n > lastCount && lastCount >= 0) blip();
    lastCount = n;
  }
  // SUPER CHAT! headline
  var hu = t - T_B - 0.07, hv = hu >= 0 && t < T_OUT + 0.45;
  show(headEl, hv);

    var sc = 0.25 + 0.75 * eback(clamp(hu / 0.38), 2.2); sc *= 1 + 0.025 * Math.sin(hu * 9) * Math.exp(-hu);
    var ty = -70 * eio(prog(t, T_TH, 0.35)), op = 1;
    if (t >= T_OUT) { var uo = eio(prog(t, T_OUT, 0.45)); sc *= 1 - uo * 0.9; ty += (82 - ty) * uo; op = 1 - ein(prog(t, T_OUT, 0.45)); }
    headEl.style.transform = 'translateY(' + ty.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')'; headEl.style.opacity = op.toFixed(3);
  }

  if (bv) {
    var bx = eback(prog(t, T_TH + 0.1, 0.4), 1.6), byy = 0, bop = 1, bsc = 1;
    if (t >= T_OUT) { var uo2 = eio(prog(t, T_OUT, 0.45)); bsc = 1 - uo2 * 0.9; byy = 67 * uo2; bop = 1 - ein(prog(t, T_OUT, 0.45)); }
    banEl.style.transform = 'translateY(' + byy.toFixed(2) + 'px) scale(' + (bx * bsc).toFixed(4) + ',' + bsc.toFixed(4) + ')';
    banEl.style.opacity = bop.toFixed(3);
  }
  drawSparks(t);
  drawLogo(t, fi);
}

// ======================= audio (always fails silently) =======================
var sfx = $('sfx'), audioOK = true, KEYPOOL = [];
for (var q = 0; q < 4; q++) { var ka = document.createElement('audio'); ka.src = 'assets/key.mp3'; ka.preload = 'auto'; KEYPOOL.push(ka); }
var kp = 0;
function tryPlay(a) { try { a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () { audioOK = false; }); } catch (e) { audioOK = false; } }
function blip() { if (!audioOK) return; tryPlay(KEYPOOL[kp]); kp = (kp + 1) % KEYPOOL.length; }
[sfx].concat(KEYPOOL).forEach(function (a) { a.addEventListener('error', function () {}, true); });

// ======================= transport =======================
var raf = 0, t0 = 0, loopTimer = 0;
function hideAll() { live = false; [cardEl, headEl, banEl].forEach(function (e) { show(e, false); }); cx.clearRect(0, 0, 1920, 1080); }
function tick(now) {
  var t = (now - t0) / 1000;
  if (t >= END) { raf = 0; hideAll(); return; }
  render(t); raf = requestAnimationFrame(tick);
}
function play() {
  if (raf) cancelAnimationFrame(raf);
  clearTimeout(loopTimer);
  lastCount = 0; live = true; audioOK = true; tryPlay(sfx);
  t0 = performance.now(); render(0); raf = requestAnimationFrame(tick);
  if (LOOP) loopTimer = setTimeout(play, Math.max(EVERY, END + 1) * 1000);
}
window.play = play;
// testing hooks (no effect on normal playback)
window.__seek = function (t) { if (raf) cancelAnimationFrame(raf); raf = 0; clearTimeout(loopTimer); live = false;
  if (t < 0 || t >= END) hideAll(); else render(t); };
window.__timeline = { end: END, keys: KEYS, lines: LINES.map(function (l) { return l.join(''); }), name: NAME, amount: AMOUNT, msg: MSG };

hideAll();
function timeout(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var assetsReady = Promise.race([timeout(2500), Promise.all([
  document.fonts ? document.fonts.load("24px 'PS2P'").catch(function () {}) : 0,
  document.fonts ? document.fonts.load("30px 'VT323'").catch(function () {}) : 0,
  LOGO.decode ? LOGO.decode().catch(function () {}) : 0,
  headEl.decode ? headEl.decode().catch(function () {}) : 0,
  banEl.decode ? banEl.decode().catch(function () {}) : 0])]).then(function () { try { fit(); } catch (e) {} });
window.__ready = assetsReady.then(function () { return true; });
if (!PAUSED) Promise.all([assetsReady, timeout(DELAY)]).then(play);
})();
