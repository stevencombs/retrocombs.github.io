---

title: 'retroCombs'
logo: '/images/brand/retroCombs-logo.svg'
favicon: '/favicon.ico'
favicon_png: '/favicon-32.png'
apple_touch_icon: '/apple-touch-icon.png'
description: 'Retro computing with a touch of modern'
name: 'retroCombs'
email: 'retrocombs@icloud.com'
tagline: 'Retro computing with a touch of modern'
url: 'https://retrocombs.com'
lang: en-US

# Posts for @retroCombs-tech set `channel: tech` in front matter.
# That channel does not offer memberships yet, so the end-of-post
# "Join the channel" strip stays hidden. Set this to true to show it
# again. The strip will then link to the tech channel's /join page.
tech_memberships: false

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /images/brand/social-preview.png
        width: 1200
        height: 630
        alt: retroCombs
  # Google's HTML verification file is copied unchanged. Without this,
  # jekyll-sitemap would list the static .html file.
  - scope:
      path: "google88a0db31e40e0904.html"
    values:
      sitemap: false

# Giscus. Comments render only when category_id is set and the page
# does not set comments: false.
giscus:
  repo: stevencombs/retrocombs.github.io
  repo_id: "MDEwOlJlcG9zaXRvcnkxODk1MjczNA=="
  category: Announcements
  category_id: DIC_kwDOASEyHs4DJGzz
  mapping: pathname
  strict: 1
  reactions_enabled: 1
  input_position: top
  lang: en
  loading: lazy

# Manual AdSense units. An empty id renders nothing: no label, no reserved box, no push().
adsense:
  enabled: true
  client: ca-pub-4132959196132899
  slots:
    in_article: { id: "1032354878", type: in-article }
    end:        { id: "1840583243", type: display }
    sidebar:    { id: "2190183019", type: fixed, width: 300, height: 600 }
    feed:       { id: "1384367805", type: display }

highlighter: rouge
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - LICENSE
  - CNAME
  - README.md
  - .gitignore
  - .DS*
