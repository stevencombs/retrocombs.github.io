# Topic menu, chips, and post counts. Counts are the categories each topic page lists.
# chip: order on the homepage (omit to keep a topic in the menu only).
# hot: filled chip. rail: order in the post sidebar (omit to leave it out).
# icon and blurb are used on /categories.
# banner: optional slug. Images are
# /images/banners/retroCombs_topic-banner_<slug>_final_{phone,wide}.png
# with ?v={{ site.github.build_revision }}.
# /categories shows the phone image; the lead card uses wide from 761px up.
# The topic page whose url matches this item uses wide from 761px and phone
# below. Omit banner and the card and the topic page keep their icon.
