<nav class="rc-follow" aria-label="Follow retroCombs">
  <p>Follow retroCombs</p>
  <ul>
    {% for item in site.data.social %}
    <li><a href="{{ item.url }}" target="_blank" rel="{% if item.rel %}{{ item.rel }} {% endif %}noopener"{% if item.note %} title="{{ item.note }}"{% endif %}><span class="rc-follow-icon" style="--rc-icon: url('{{ item.icon | prepend: '/images/icons/' | append: '.svg' | relative_url }}')" aria-hidden="true"></span><span class="rc-follow-label">{{ item.label }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
