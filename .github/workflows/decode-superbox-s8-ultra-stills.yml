# One-shot helper for the SuperBOX S8 Ultra companion branch only.
# Decodes staged base64 stills into JPEGs, then removes the staging
# files and this workflow so they do not remain in the pull request.
name: Decode SuperBOX S8 Ultra stills

on:
  push:
    branches:
      - superbox-s8-ultra-companion

permissions:
  contents: write

concurrency:
  group: decode-superbox-s8-ultra-stills
  cancel-in-progress: false

jobs:
  decode:
    if: github.ref == 'refs/heads/superbox-s8-ultra-companion' && hashFiles('_b64tmp/decode.sh') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Decode stills, remove staging files, and delete this workflow
        run: |
          set -euo pipefail
          bash _b64tmp/decode.sh
          git rm -f --ignore-unmatch -- .github/workflows/decode-superbox-s8-ultra-stills.yml
          git add -- images/posts/2026-11-27-superbox-s8-ultra.jpg images/posts/2026-11-27-superbox-s8-ultra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add SuperBOX S8 Ultra companion post images"
          git push
